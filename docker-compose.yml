# Plain Docker host (VM or LXC on Proxmox):  docker compose up -d
services:
  web:
    image: ghcr.io/kobewijnants/kobecloud.be:latest
    build: .
    container_name: kobecloud
    restart: unless-stopped
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
